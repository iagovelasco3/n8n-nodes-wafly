name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n8n: ['1.120.4', '2.43.7']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test && npm run lint && npm run check:generated
      - run: git diff --exit-code -- nodes credentials schema
      - run: npm pack
      - run: docker pull n8nio/n8n:${{ matrix.n8n }}
      - run: python3 tests/runtime/run.py --image n8nio/n8n:${{ matrix.n8n }} --tarball "n8n-nodes-wafly-$(node -p "require('./package.json').version").tgz" --out /tmp/wafly-runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-runtime-${{ matrix.n8n }}
          path: /tmp/wafly-runtime/*.log
  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # npm >= 11.5.1 required for OIDC trusted publishing
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm publish --access public
