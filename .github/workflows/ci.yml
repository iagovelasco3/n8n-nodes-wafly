name: Validate node
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  existing-migration-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run only existing offline lab in isolated n8n
        run: python3 tests/native-migration-lab/run.py /tmp/wafly-existing-lab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: existing-migration-lab-n8n-2.43.7
          path: /tmp/wafly-existing-lab
          retention-days: 30
